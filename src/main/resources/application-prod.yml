spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:tgbotmap}
    username: ${DB_USERNAME:tgbotmap}
    password: ${DB_PASSWORD:tgbotmap}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

telegram:
  bot:
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}

logging:
  level:
    com.tgbotmap: INFO
    org.springframework: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
