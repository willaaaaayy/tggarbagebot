<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта свалок</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=YOUR_API_KEY&lang=ru_RU"></script>
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
        .status {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="status" id="status">Загрузка точек...</div>
    <div id="map"></div>

    <script>
        let map;
        let placemarks = [];
        
        // Replace with your admin credentials
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'admin';
        
        async function loadLocations() {
            try {
                const response = await fetch('/admin/locations', {
                    headers: {
                        'Authorization': 'Basic ' + btoa(ADMIN_USERNAME + ':' + ADMIN_PASSWORD)
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load locations: ' + response.status);
                }
                
                const locations = await response.json();
                updateMap(locations);
                document.getElementById('status').textContent = 'Точек на карте: ' + locations.length + ' | Обновление каждые 30 сек';
            } catch (error) {
                console.error('Error loading locations:', error);
                document.getElementById('status').textContent = 'Ошибка загрузки: ' + error.message;
            }
        }
        
        function updateMap(locations) {
            // Clear existing placemarks
            placemarks.forEach(pm => map.geoObjects.remove(pm));
            placemarks = [];
            
            if (locations.length === 0) {
                return;
            }
            
            // Calculate bounds
            let bounds = [];
            
            locations.forEach(loc => {
                if (loc.latitude && loc.longitude) {
                    const placemark = new ymaps.Placemark(
                        [loc.latitude, loc.longitude],
                        {
                            balloonContent: loc.address || 'Адрес не указан',
                            hintContent: loc.address || 'Адрес не указан'
                        },
                        {
                            preset: 'islands#redDotIcon'
                        }
                    );
                    map.geoObjects.add(placemark);
                    placemarks.push(placemark);
                    bounds.push([loc.latitude, loc.longitude]);
                }
            });
            
            // Fit map to bounds
            if (bounds.length > 0) {
                if (bounds.length === 1) {
                    map.setCenter(bounds[0], 15);
                } else {
                    map.setBounds(bounds, { checkZoomRange: true, zoomMargin: 30 });
                }
            }
        }
        
        ymaps.ready(init);
        
        function init() {
            map = new ymaps.Map('map', {
                center: [55.7558, 37.6173], // Moscow by default
                zoom: 10
            });
            
            // Load initial data
            loadLocations();
            
            // Refresh every 30 seconds
            setInterval(loadLocations, 30000);
        }
    </script>
</body>
</html>
