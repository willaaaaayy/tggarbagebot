name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Unit tests are pure Mockito (no DB). The @SpringBootTest contextLoads
      # test needs PostgreSQL + env, so it is excluded from CI on purpose.
      - name: Compile & run unit tests
        run: ./mvnw -B -ntp test -Dtest='MapLinkServiceTest,AddressServiceTest,BotServiceTest,WebhookControllerTest'
